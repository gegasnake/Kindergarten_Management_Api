services:
  db:
    image: postgres:17
    container_name: kindergarten_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kindergarten_db
      POSTGRES_USER: kindergarten_user
      POSTGRES_PASSWORD: kindergarten_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U kindergarten_user -d kindergarten_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: kindergarten_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: kindergarten_db
      POSTGRES_USER: kindergarten_user
      POSTGRES_PASSWORD: kindergarten_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: